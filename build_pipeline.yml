---
parameters:
  - name: VarGroup
    displayName: Variable group
  - name: Environment
    displayName: Environment to use
  - name: DeployBranch
    displayName: Branch to use
    default: main

trigger: none
pr: none

variables:
  - group: ${{parameters.VarGroup}}
  - name: solution
    value: '**/*.sln'
  - name: buildPlatform
    value: 'Any CPU'
  - name: buildConfiguration
    value: 'Release'


stages:

  - stage: BuildBlaiseFileUploadAlien_${{parameters.Environment}}
    displayName: Build Blaise File Upload Alien (${{parameters.Environment}})
    jobs:
      - job: BuildApp
        displayName: Build and Publish
        pool: 
          vmImage: 'windows-latest'
        steps:
          - checkout: self

          - task: NuGetToolInstaller@1
            displayName: 'Install NuGet Tools'

          - task: NuGetCommand@2
            displayName: 'Restore NuGet Packages'
            inputs:
              restoreSolution: '$(solution)'

          - task: VSBuild@1
            displayName: 'Build Solution'
            inputs:
              solution: '$(solution)'
              platform: '$(buildPlatform)'
              configuration: '$(buildConfiguration)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: '$(Pipeline.Workspace)/BlaiseFileUploadAlien/*.csproj'

          - task: DotNetCoreCLI@2
            displayName: 'Dotnet Publish (win-x64)'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(Pipeline.Workspace)/BlaiseFileUploadAlien//*.csproj'
              arguments: '-c Release -r win-x64 --self-contained false -o $(Build.ArtifactStagingDirectory)/BlaiseFileUploadAlien'
              zipAfterPublish: false

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact: BlaiseFileUploadAlien'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/BlaiseFileUploadAlien'
              ArtifactName: 'BlaiseFileUploadAlien'
              publishLocation: 'Container'


  - stage: DeployBlaiseFileUploadAlien_${{parameters.Environment}}
    displayName: Deploy Blaise File Upload Alien (${{parameters.Environment}})
    dependsOn: BuildBlaiseFileUploadAlien_${{parameters.Environment}}
    jobs:
      - deployment: DeployBlaiseFileUploadAlien
        displayName: Deploy Blaise File Upload Alien
        variables:
          ENV_BLAISE_SERVER_BINDING: $(ENV_BLAISE_INTERNAL_SERVER_BINDING)
        environment:
          name: ${{parameters.Environment}}
          resourceType: virtualMachine
          tags: blaise-file-upload-alien
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: BlaiseFileUploadAlien
                  displayName: 'Download Build Artifact'

                - powershell: |
                    $ServiceName = "BlaiseFileUploadAlien"
                    if (Get-Service -Name $ServiceName -ErrorAction SilentlyContinue) {
                        Write-Host "Service $ServiceName exists. Stopping to release file locks..."
                        Stop-Service -Name $ServiceName -Force
                        Start-Sleep -Seconds 5 # Give it time to fully spin down
                    } else {
                        Write-Host "Service $ServiceName does not exist yet. Proceeding..."
                    }
                  displayName: 'Pre-Deployment: Stop Windows Service'

                - task: CopyFiles@2
                  displayName: 'Copy files'
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/BlaiseFileUploadAlien'
                    Contents: '**'
                    TargetFolder: 'c:\BlaiseServices\BlaiseFileUploadAlien'
                    CleanTargetFolder: true
                    OverWrite: true

                - powershell: |
                    $ServiceName = "BlaiseFileUploadAlien"
                    $ServicePath = "c:\BlaiseServices\BlaiseFileUploadAlien\BlaiseFileUploadAlien.exe"

                    # Create service if it doesn't exist
                    if (-not (Get-Service -Name $ServiceName -ErrorAction SilentlyContinue)) {
                        Write-Host "Creating service $ServiceName..."
                        New-Service -Name $ServiceName -BinaryPathName $ServicePath -DisplayName "Blaise File Upload Alien" -StartupType Automatic
                    }

                    Write-Host "Starting service $ServiceName..."
                    Start-Service -Name $ServiceName
                  displayName: 'Post-Deployment: Create and Start Windows Service'
